<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Phương án B — FLF mockup | Trang trọng, biên tập</title>
    <meta
      name="description"
      content="Mockup phương án B: tư vấn trang trọng, typography điểm nhấn, xanh đen chủ đạo, bố cục biên tập."
    />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <link rel="icon" href="../public/brand/logo-color.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Sora:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body id="top">
    <a class="skip" href="#main">Bỏ qua đến nội dung chính</a>

    <div class="review-bar" role="note">
      <span>Bản thiết kế chờ duyệt · Phương án B · Trang trọng / biên tập</span>
      <a href="../index.html">← So sánh hai hướng</a>
    </div>

    <header class="site-header">
      <div class="wrap header-inner">
        <a class="brand" href="#top" aria-label="First Legal Force — trang chủ">
          <img
            src="../public/brand/logo-color.png"
            alt="Logo First Legal Force"
            width="52"
            height="52"
          />
          <span class="brand-lockup">
            <strong data-brand-text>First Legal Force</strong>
            <em>Tư vấn đa lĩnh vực</em>
          </span>
        </a>
        <nav class="nav-desktop" aria-label="Menu chính">
          <ul data-nav></ul>
        </nav>
        <a class="btn btn-sm header-cta" href="#contact" data-cta-primary
          >Liên hệ tư vấn</a
        >
        <button
          class="menu-toggle"
          type="button"
          data-menu-toggle
          aria-expanded="false"
          aria-controls="mobile-nav"
          aria-label="Mở menu"
        >
          Menu
        </button>
      </div>
      <div class="mobile-panel" id="mobile-nav" data-mobile-panel>
        <nav aria-label="Menu mobile">
          <ul data-nav-mobile></ul>
        </nav>
      </div>
    </header>

    <main id="main">
      <section class="hero" aria-labelledby="hero-title">
        <div class="hero-plane" aria-hidden="true">
          <div class="hero-plane-shade"></div>
          <img
            class="hero-mark"
            src="../public/brand/logo-color.png"
            alt=""
          />
        </div>
        <div class="wrap hero-copy">
          <p class="eyebrow" data-hero-eyebrow></p>
          <p class="masthead" data-tagline></p>
          <h1 id="hero-title" data-hero-headline></h1>
          <p class="hero-sub" data-hero-sub></p>
          <div class="hero-cta">
            <a class="btn" href="#contact" data-cta-primary></a>
            <a class="text-link" href="#services" data-cta-secondary></a>
          </div>
        </div>
      </section>

      <section id="about" class="section about reveal">
        <div class="wrap narrow">
          <p class="section-index">01 — Phân định vai trò</p>
          <h2 data-about-title></h2>
          <p class="lead dropcap" data-about-lead></p>
          <div class="about-grid" data-about-points></div>
        </div>
      </section>

      <section id="services" class="section services reveal">
        <div class="wrap">
          <div class="section-head">
            <p class="section-index">02 — Lĩnh vực</p>
            <h2 data-services-title></h2>
            <p class="note" data-services-note></p>
          </div>
          <div class="services-rail" data-services></div>
        </div>
      </section>

      <section id="process" class="section process reveal">
        <div class="wrap">
          <p class="section-index light">03 — Quy trình</p>
          <h2 data-process-title></h2>
          <ol class="steps" data-steps></ol>
        </div>
      </section>

      <section id="partners" class="section partners reveal">
        <div class="wrap partners-panel">
          <div>
            <p class="section-index">04 — Phối hợp</p>
            <h2 data-partners-title></h2>
            <p class="lead" data-partners-lead></p>
          </div>
          <ol class="partner-list" data-partner-items></ol>
        </div>
      </section>

      <section id="contact" class="section contact reveal">
        <div class="wrap contact-frame">
          <h2 data-contact-title></h2>
          <p class="lead" data-contact-lead></p>
          <a class="btn" href="#" data-contact-cta onclick="return false;"></a>
          <p class="privacy" data-contact-privacy></p>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="wrap footer-grid">
        <div>
          <img
            src="../public/brand/first-legal-force.png"
            alt="FIRST - LEGAL FORCE"
            class="wordmark"
            width="220"
            height="80"
          />
          <p data-footer-legal></p>
          <p data-footer-mst></p>
          <p class="muted" data-footer-note></p>
        </div>
        <div class="footer-social">
          <span>Kết nối</span>
          <a data-facebook href="#" rel="noopener noreferrer" target="_blank"
            >Facebook</a
          >
          <a data-linkedin href="#" rel="noopener noreferrer" target="_blank"
            >LinkedIn</a
          >
        </div>
      </div>
    </footer>

    <script src="../shared/content.js"></script>
    <script src="../shared/render.js"></script>
  </body>
</html>
