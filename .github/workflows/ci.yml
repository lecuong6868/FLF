name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: flf
          POSTGRES_PASSWORD: flf_ci
          POSTGRES_DB: flf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flf -d flf"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://flf:flf_ci@localhost:5432/flf
      PAYLOAD_SECRET: ci-secret-change-me-32-characters-min
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000
      SEED_ADMIN_EMAIL: admin@example.com
      SEED_ADMIN_PASSWORD: ChangeMeNow!Abc123
      SEED_ADMIN_NAME: CI Admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run audit:prod
      - run: npm run build
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
