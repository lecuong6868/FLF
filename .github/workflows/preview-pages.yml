# Xuất bản preview thiết kế công khai lên GitHub Pages (HTTPS, base path /FLF/).
# Điều kiện đã xác minh:
#   1) Settings → Pages → Source = GitHub Actions (ảnh khách 2026-10-29).
#   2) Environment github-pages chỉ cho phép nhánh main — GIỮ NGUYÊN (không thêm aat/**).
# Deploy chỉ khi push main hoặc workflow_dispatch chọn main.
# Chỉ publish tài nguyên thiết kế — không gồm .aat, zip WordPress, secrets.
name: Preview Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-preview
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ghi commit triển khai
        run: |
          echo "${{ github.sha }}" > DEPLOY-COMMIT.txt
          echo "ref=${{ github.ref_name }}" >> DEPLOY-COMMIT.txt
          echo "run=${{ github.run_id }}" >> DEPLOY-COMMIT.txt
          echo "event=${{ github.event_name }}" >> DEPLOY-COMMIT.txt
      - name: Chuẩn bị thư mục publish (chỉ thiết kế công khai)
        run: |
          mkdir -p _site
          cp index.html robots.txt README.md package.json DEPLOY-COMMIT.txt _site/ 2>/dev/null || true
          cp -r option-a option-b mockups public docs shared _site/
          # Không copy: .aat, flf.vn_*.zip, deploy/
          test -f _site/index.html
          test -f _site/option-b/index.html
          test -f _site/public/brand/logo-color.png
          test -f _site/mockups/B-desktop-1440.png
          grep -q 'noindex' _site/option-b/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Nhật ký nhánh / quyền
        run: |
          {
            echo "## Deploy Preview Pages"
            echo ""
            echo "- ref: \`${{ github.ref_name }}\`"
            echo "- sha: \`${{ github.sha }}\`"
            echo "- event: \`${{ github.event_name }}\`"
            echo "- URL kỳ vọng: https://lecuong6868.github.io/FLF/"
            echo "- base path: \`/FLF/\`"
            echo ""
            echo "Environment \`github-pages\` chỉ cho phép \`main\` (giữ nguyên)."
          } >> "$GITHUB_STEP_SUMMARY"
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Tóm tắt URL
        if: success()
        run: |
          {
            echo "## Preview đã xuất bản"
            echo ""
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- page_url: ${{ steps.deployment.outputs.page_url }}"
            echo "- URL: https://lecuong6868.github.io/FLF/"
            echo "- Phương án B: https://lecuong6868.github.io/FLF/option-b/"
            echo "- Xác minh: \`FLF_BASE_URL=https://lecuong6868.github.io/FLF npm run verify:preview\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Nhắc điểm chặn nếu deploy thất bại
        if: failure()
        run: |
          {
            echo "## Deploy Pages thất bại"
            echo ""
            echo "Job \`build\` đã tạo artifact; job \`deploy\` thất bại trên \`main\`."
            echo ""
            echo "Kiểm tra:"
            echo "1. Actions → lượt chạy này → log bước \`deploy-pages\`."
            echo "2. Settings → Pages → Source vẫn là **GitHub Actions**."
            echo "3. Settings → Environments → github-pages → Deployment branches gồm \`main\`."
            echo "4. Xác minh sau khi xanh: \`FLF_BASE_URL=https://lecuong6868.github.io/FLF npm run verify:preview\`"
          } >> "$GITHUB_STEP_SUMMARY"
