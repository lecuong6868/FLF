# Build image CMS trên GitHub (đủ RAM) rồi đẩy lên ghcr.io để VPS chỉ việc tải về chạy.
# VPS FLF chỉ ~1 GB RAM nên KHÔNG build được tại chỗ.
name: CMS Image

on:
  push:
    branches: [main]
    paths:
      - 'cms/**'
      - '.github/workflows/cms-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: cms-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: cms
          push: true
          tags: |
            ghcr.io/lecuong6868/flf-cms:latest
            ghcr.io/lecuong6868/flf-cms:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
