services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flf_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-flf}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-flf} -d ${POSTGRES_DB:-flf}']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-flf}:${POSTGRES_PASSWORD:-flf_change_me}@db:5432/${POSTGRES_DB:-flf}
      PORT: 3000
      HOSTNAME: 0.0.0.0
    volumes:
      - media_data:/app/media
    expose:
      - '3000'

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  media_data:
  caddy_data:
  caddy_config:
